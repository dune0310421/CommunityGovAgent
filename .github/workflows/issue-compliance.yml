name: Issue 规范性检测
# 步骤 1：Issue 新建/修改自动触发，也支持手动输入本仓 Issue 编号。
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 本仓库的 Issue 编号
        required: true
        type: string
      post_comment:
        description: 是否发布或更新检查结果评论
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

# 同一个 Issue 串行处理，避免同时创建两条结果评论。
concurrency:
  group: issue-compliance-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  issue_compliance:
    name: 检查 Issue 模板并反馈
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 下载本仓代码和模板到 runner，准备 Python 并安装依赖。
      - name: 获取检查代码和本仓模板
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装检查依赖
        run: python -m pip install -r issueGovAgent/requirements.txt
      # 执行检查并反馈
      - name: 检查并反馈
        working-directory: issueGovAgent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动提供的工作流令牌，用于读取 Issue 和写评论
          REPOSITORY: ${{ github.repository }} # 仓库全名，格式为 owner/repo
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          TEMPLATE_DIR: ../.github/ISSUE_TEMPLATE # 模板已随 checkout 下载，Python 直接读取本地文件
          POST_COMMENT: ${{ github.event_name == 'issues' || inputs.post_comment }} # 自动触发会发布评论；手动触发默认仅预览，勾选后才发布
        run: python src/issue_checker.py
