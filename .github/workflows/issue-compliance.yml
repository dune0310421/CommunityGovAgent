name: Issue 规范性检测
# 步骤 1：Issue 新建/修改自动触发，也支持手动输入本仓 Issue 编号。
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 本仓库的 Issue 编号
        required: true
        type: string


permissions:
  contents: read
  issues: write

# 同一个 Issue 串行处理，避免同时创建两条结果评论。
concurrency:
  group: issue-compliance-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  issue_compliance:
    name: 检查 Issue 模板并反馈
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 下载本仓代码和模板到 runner，准备环境并安装依赖。
      - name: 获取检查代码和本仓模板
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装检查依赖
        run: python -m pip install -r .github/scripts/issue_gov/requirements.txt
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.316
          claude --version
      # 执行检查并反馈
      - name: 检查并反馈
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动提供的工作流令牌，用于读取 Issue 和写评论
          AGENT_API_KEY: ${{ secrets.GLM_CODING_API_KEY }} # 仅无模板匹配时交给 Claude Code
          LLM_MODEL: ${{ vars.LLM_MODEL || 'glm-5.3' }}
          REPOSITORY: ${{ github.repository }} # 仓库全名，格式为 owner/repo
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          TEMPLATE_DIR: .github/ISSUE_TEMPLATE # 模板已随 checkout 下载，Python 直接读取本地文件
        run: python .github/scripts/issue_gov/issue_checker.py
